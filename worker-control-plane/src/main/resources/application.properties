spring.application.name=d4-synthetic-control-plane
spring.main.banner-mode=off
server.port=8443
server.ssl.enabled=true
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.key-store=${D4_SERVER_KEYSTORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${D4_KEYSTORE_PASSWORD}
server.ssl.trust-store=${D4_TRUSTSTORE}
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${D4_KEYSTORE_PASSWORD}
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=8
server.tomcat.max-connections=32
server.tomcat.accept-count=16
server.tomcat.connection-timeout=5s
d4.jdbc.url=${D4_JDBC_URL}
d4.jdbc.user=${D4_JDBC_USER}
d4.jdbc.password=${D4_JDBC_PASSWORD}
d4.identities=${D4_IDENTITIES}
